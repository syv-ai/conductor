name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff check
        run: uvx ruff@0.17.0 check .
      - name: Ruff format
        run: uvx ruff@0.17.0 format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Mypy
        run: uv run mypy packages
      - name: Pytest
        run: uv run pytest tests/ -q -m "not slow"

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Execute the example notebooks
        run: |
          failed=0
          for nb in examples/*.ipynb; do
            echo "::group::$nb"
            uv run jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/notebooks" "$nb" || { echo "::error file=$nb::notebook failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the docs
        run: uv run --group docs mkdocs build --strict
