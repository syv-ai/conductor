name: Publish

# Triggered on tag push (e.g. ``git tag v0.1.0 && git push --tags``).
# Builds ``syv-conductor`` into ``dist/`` and uploads it to PyPI.
#
# Auth: ``PYPI_API_TOKEN`` repo secret. Use a project-scoped token from
# https://pypi.org/manage/account/token/ — limit it to the package
# rather than account-wide. Trusted Publishing (OIDC) is the long-term
# upgrade.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Build straight into ``dist/`` so the publish step has a single,
      # predictable directory to upload.
      - name: Build wheel + sdist
        run: |
          mkdir -p dist
          uv build packages/conductor --out-dir dist
          ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Idempotent on re-runs of the same tag.
          skip-existing: true
