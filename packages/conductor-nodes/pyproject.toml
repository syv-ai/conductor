[project]
name = "syv-conductor-nodes"
version = "2.0.0"
description = "Standard-library nodes for conductor — text, math, logic, JSON, regex, and a decision gate. registry(categories=[...]) filters on each node's own category."
requires-python = ">=3.12"
authors = [{ name = "Syvai", email = "billy@syv.ai" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "syv-conductor==2.0.0",
    "pydantic>=2.11",
    "regex>=2024.11.6",
]

[project.urls]
Repository = "https://github.com/syv-ai/conductor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor_nodes"]
