[project]
name = "syv-conductor"
version = "2.0.0"
description = "Reusable DAG execution engine — a typed node contract, graph compilation, and a streaming engine that runs a node once per row, with retries, and runs that pause for a person."
requires-python = ">=3.12"
authors = [{ name = "Syvai", email = "billy@syv.ai" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.11", "pyyaml>=6.0"]

[project.optional-dependencies]
# Sibling-package extras — published in lockstep from this monorepo, so
# pinned `==` to the matching version to prevent resolver skew.
nodes = ["syv-conductor-nodes==2.0.0"]
providers = ["syv-conductor-providers==2.0.0"]
all = [
    "syv-conductor-nodes==2.0.0",
    "syv-conductor-providers[fastapi]==2.0.0",
]

[project.urls]
Repository = "https://github.com/syv-ai/conductor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]
