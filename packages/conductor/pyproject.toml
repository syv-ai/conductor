[project]
name = "syv-conductor"
version = "2.0.0"
description = "Run graphs of typed Python functions: a graph is JSON that compiles with its problems listed, calls a node once per item of a list another node returns, and pauses for a person in a run that saves as JSON."
requires-python = ">=3.12"
authors = [{ name = "Syvai", email = "billy@syv.ai" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "polars>=2.0",
    "pydantic>=2.12",
    # 4.16 is the first whose sentinel pickles and copies to itself and prints as its bare name (REQUIRED, SKIPPED).
    "typing-extensions>=4.16",
]

[project.optional-dependencies]
# Released from one repository at one version, so pinned `==` to it.
nodes = ["syv-conductor-nodes==2.0.0"]
providers = ["syv-conductor-providers==2.0.0"]
all = ["syv-conductor-nodes==2.0.0", "syv-conductor-providers==2.0.0"]

[project.urls]
Repository = "https://github.com/syv-ai/conductor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]
