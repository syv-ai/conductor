repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: \.ipynb$
  - repo: local
    hooks:
      - id: imported-only-through-init
        name: a package is imported only through its __init__
        language: pygrep
        files: ^packages/conductor/src/conductor/
        # an absolute import of another package's file, or a relative import that climbs out of a package
        entry: '^\s*from (conductor\._internal\.\w+\.\w+|\.\.\.)'
      - id: classes-imported-by-name
        name: a class is imported by name and written bare
        language: system
        entry: .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_core/test_imports_by_name.py
        files: ^(packages/[^/]+/src|tests)/.*\.py$
        pass_filenames: false
      - id: public-definitions-have-docstrings
        name: every public class and module-level function has a docstring
        language: system
        entry: .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_core/test_docstrings.py
        files: ^packages/[^/]+/src/.*\.py$
        pass_filenames: false
      - id: no-plan-references
        name: code and docs say what the code does, not which plan or decision it came from
        language: pygrep
        files: ^(packages/.*\.(py|txt|md)|tests/.*\.py|docs/.*\.md|README\.md|AGENTS\.md|CHANGELOG\.md|pyproject\.toml|skills/.*)$
        entry: '\bD-[A-Z]{1,3}\d+\b|\bplans/|\bredo/|\bBOARD\.md\b|\bdesign-decisions\.md\b'
      - id: no-ruled-out-phrases
        name: prose uses none of the phrases ruled out as private idiom
        language: pygrep
        args: [--ignore-case]
        files: ^(packages/[^/]+/src/.*\.py|docs/.*\.md|README\.md|packages/conductor/src/conductor/about/.*\.(txt|md))$
        entry: '\bas it stands\b|\bbirthed\b|\bbarren\b'
