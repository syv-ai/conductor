[project]
name = "conductor-workspace"
version = "0.1.0"
description = "Run graphs of typed Python functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
syv-conductor = { workspace = true }
syv-conductor-nodes = { workspace = true }
syv-conductor-providers = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# A stub in a syntax 3.13 has; only a type checker reads it.
extend-exclude = ["examples/*.ipynb", "node.ipynb", "**/table_as_a_type_checker_reads_it.pyi"]

[tool.ruff.lint]
# Conservative baseline: pyflakes + pycodestyle + isort. Expand later if desired.
select = ["E", "F", "I", "W"]
# E501 (line-too-long) is noisy for prose-ish docstrings and long strings.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A package's __init__.py re-exports; its imports are its public surface.
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    # fastapi + httpx run the recipe in docs/serving-runs.md under test.
    "fastapi>=0.135",
    "httpx>=0.27",
    # two uvicorn workers run the FastAPI provider under test
    "uvicorn>=0.30",
    "types-regex",
    "syv-conductor",
    "syv-conductor-nodes",
    "syv-conductor-providers",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "jupyter>=1.1.1",
    "pre-commit>=4.5.1",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest-timeout>=2.4.0",
    "pandas>=2.2",
    "import-linter>=2.1",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]

# The packages of conductor._internal, top to bottom: a package imports only packages below it. Packages on one
# line with " | " between them import none of each other. Bottom to top this is the order of the module map
# (plans: D-L143), with its third row split where its packages stand on one another: series on types, and
# table, field and context on those.
[tool.importlinter]
root_packages = ["conductor"]
contract_types = ["through_init: tests.import_contracts.ThroughInitContract"]

[[tool.importlinter.contracts]]
name = "conductor._internal is in layers"
type = "layers"
containers = ["conductor._internal"]
layers = [
    "graph",
    "registry",
    "run",
    "compiled",
    "node",
    "gate",
    "ask | record",
    "table | field | context",
    "series",
    "types",
    "problem",
    "base",
]
# The one import up a layer, an annotation only (under TYPE_CHECKING): a run names the graph it is a run of,
# Run.graph: Graph, and Graph is the layer on top because it makes runs.
ignore_imports = ["conductor._internal.run.type -> conductor._internal.graph"]

[[tool.importlinter.contracts]]
name = "a package of conductor._internal is imported only through its __init__"
type = "through_init"
container = "conductor._internal"
# a module of functions that callers write through the module: `from conductor._internal.problem import catalogue as problem`
modules_imported_by_name = ["conductor._internal.problem.catalogue", "conductor._internal.problem.declarations"]
